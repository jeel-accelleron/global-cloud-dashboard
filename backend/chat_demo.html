<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Items Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        #chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px 30px;
            background: #f8f9fa;
        }

        #chat-container::-webkit-scrollbar {
            width: 8px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 70%;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .user {
            flex-direction: row-reverse;
        }

        .user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            flex-direction: row;
        }

        .assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .assistant .avatar {
            background: #e0e0e0;
            color: #666;
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        #message-input:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #6c757d;
        }

        .clear-btn:hover {
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        .examples {
            padding: 15px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .examples p {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .example-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-chip {
            padding: 6px 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .error-message {
            background: #f8d7da !important;
            color: #721c24 !important;
            border-color: #f5c6cb !important;
        }

        /* Markdown formatting inside assistant bubbles */
        .assistant .message-bubble p { margin: 0 0 8px 0; }
        .assistant .message-bubble p:last-child { margin-bottom: 0; }
        .assistant .message-bubble h1,
        .assistant .message-bubble h2,
        .assistant .message-bubble h3,
        .assistant .message-bubble h4 {
            margin: 12px 0 6px 0;
            font-weight: 600;
            color: #2d2d44;
        }
        .assistant .message-bubble h1 { font-size: 18px; }
        .assistant .message-bubble h2 { font-size: 17px; }
        .assistant .message-bubble h3 { font-size: 16px; }
        .assistant .message-bubble h4 { font-size: 15px; }
        .assistant .message-bubble strong { color: #2d2d44; font-weight: 600; }
        .assistant .message-bubble em { color: #555; }
        .assistant .message-bubble ul,
        .assistant .message-bubble ol {
            margin: 4px 0 8px 0;
            padding-left: 22px;
        }
        .assistant .message-bubble li { margin: 2px 0; }
        .assistant .message-bubble li > p { margin: 0; }
        .assistant .message-bubble code {
            background: #f1f1f7;
            color: #c7254e;
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
            font-size: 13px;
        }
        .assistant .message-bubble pre {
            background: #1e1e2e;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .assistant .message-bubble pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-size: 13px;
        }
        .assistant .message-bubble a {
            color: #667eea;
            text-decoration: none;
        }
        .assistant .message-bubble a:hover { text-decoration: underline; }
        .assistant .message-bubble blockquote {
            border-left: 3px solid #667eea;
            margin: 8px 0;
            padding: 4px 12px;
            color: #555;
            background: #f8f8fc;
            border-radius: 0 6px 6px 0;
        }
        .assistant .message-bubble table {
            border-collapse: collapse;
            margin: 8px 0;
            width: 100%;
            font-size: 13px;
        }
        .assistant .message-bubble th,
        .assistant .message-bubble td {
            border: 1px solid #e0e0e0;
            padding: 6px 10px;
            text-align: left;
        }
        .assistant .message-bubble th {
            background: #f5f5fa;
            font-weight: 600;
        }
        .assistant .message-bubble hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 10px 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>🤖</span>
                Work Items Chat Assistant
            </h1>
            <p>Ask natural language questions about Azure DevOps work items</p>
        </div>

        <div id="chat-container"></div>

        <div class="examples">
            <p>Try asking:</p>
            <div class="example-chips">
                <div class="example-chip" onclick="sendExample('Show me all active bugs')">Show me all active bugs</div>
                <div class="example-chip" onclick="sendExample('What are the high priority items?')">High priority items</div>
                <div class="example-chip" onclick="sendExample('List tasks updated last week')">Recently updated tasks</div>
                <div class="example-chip" onclick="sendExample('Find work items about authentication')">Search authentication</div>
            </div>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="message-input" 
                placeholder="Ask about work items..." 
                autocomplete="off"
            />
            <button id="send-btn" onclick="sendMessage()">Send</button>
            <button class="clear-btn" onclick="clearChat()">Clear</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/workitems/copilot/chat/stream/';
        const CLEAR_URL = 'http://localhost:8000/api/workitems/copilot/chat/clear/';
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        let sessionId = 'user-' + Math.random().toString(36).substr(2, 9);
        let isProcessing = false;

        if (window.marked) {
            marked.setOptions({ breaks: true, gfm: true });
        }

        function renderMarkdown(text) {
            if (!window.marked || !window.DOMPurify) {
                return text.replace(/[&<>]/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;'
                }[c])).replace(/\n/g, '<br>');
            }
            return DOMPurify.sanitize(marked.parse(text || ''));
        }

        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            if (role === 'assistant') {
                bubble.dataset.raw = content || '';
                bubble.innerHTML = renderMarkdown(content || '');
            } else {
                bubble.textContent = content;
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return bubble;
        }

        function addLoadingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'loading-indicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = '<span class="loading"></span> <span class="loading"></span> <span class="loading"></span>';
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loading = document.getElementById('loading-indicator');
            if (loading) {
                loading.remove();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isProcessing) return;

            isProcessing = true;
            sendBtn.disabled = true;
            messageInput.disabled = true;

            addMessage(message, 'user');
            messageInput.value = '';
            addLoadingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        message, 
                        session_id: sessionId 
                    })
                });

                removeLoadingIndicator();

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const assistantBubble = addMessage('', 'assistant');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                
                                if (data.content) {
                                    const raw = (assistantBubble.dataset.raw || '') + data.content;
                                    assistantBubble.dataset.raw = raw;
                                    assistantBubble.innerHTML = renderMarkdown(raw);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }

                                if (data.error) {
                                    assistantBubble.textContent = '❌ Error: ' + data.error;
                                    assistantBubble.classList.add('error-message');
                                }
                            } catch (e) {
                                // Skip invalid JSON
                            }
                        }
                    }
                }
            } catch (error) {
                removeLoadingIndicator();
                const errorBubble = addMessage('❌ Error: ' + error.message, 'assistant');
                errorBubble.classList.add('error-message');
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        async function clearChat() {
            try {
                await fetch(CLEAR_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                chatContainer.innerHTML = '';
                // Generate new session ID
                sessionId = 'user-' + Math.random().toString(36).substr(2, 9);
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }

        function sendExample(text) {
            messageInput.value = text;
            sendMessage();
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        });

        // Initial greeting
        window.addEventListener('load', () => {
            const greeting = addMessage("Hi! I'm your Azure DevOps Work Items assistant. I can help you query and analyze work items from the Global IS Infrastructure Cloud area. Try asking me about bugs, tasks, or recent updates!", 'assistant');
        });
    </script>
</body>
</html>
